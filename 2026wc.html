    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js">
        // ===== 球员数据统计弹窗 =====
        function showPlayerStats(playerName, club) {
            const overlay = document.getElementById('playerModal');
            document.getElementById('playerModalAvatar').textContent = playerName.charAt(0);
            document.getElementById('playerModalName').textContent = playerName;
            document.getElementById('playerModalClub').textContent = club || '未知俱乐部';
            const matchesDiv = document.getElementById('playerModalMatches');
            matchesDiv.innerHTML = '<div class="player-modal-loading">⏳ 加载中...</div>';
            overlay.classList.add('active');
            fetchPlayerRecentMatches(playerName).then(matches => {
                if (!matches || matches.length === 0) {
                    matchesDiv.innerHTML = '<div class="player-modal-error">暂无近期比赛数据</div>';
                    return;
                }
                matchesDiv.innerHTML = matches.map(m => `
                    <div class="player-modal-match">
                        <span class="player-modal-match-date">${m.date}</span>
                        <span class="player-modal-match-fixtures">${m.home} <span class="player-modal-match-score">${m.score}</span> ${m.away}</span>
                        <span class="player-modal-match-stats">⚽${m.goals} 🅰️${m.assists} ⭐${m.rating}</span>
                    </div>
                `).join('');
            }).catch(() => {
                matchesDiv.innerHTML = '<div class="player-modal-error">数据加载失败，请稍后再试</div>';
            });
        }
        async function fetchPlayerRecentMatches(playerName) {
            // 使用 TheSportsDB 免费API（无需Key）
            try {
                const resp = await fetch(`https://www.thesportsdb.com/api/v1/json/3/searchplayers.php?p=${encodeURIComponent(playerName)}`);
                const data = await resp.json();
                if (data.player && data.player.length > 0) {
                    const pid = data.player[0].idPlayer;
                    const eventsResp = await fetch(`https://www.thesportsdb.com/api/v1/json/3/eventslast.php?id=${pid}`);
                    const eventsData = await eventsResp.json();
                    if (eventsData.results) {
                        return eventsData.results.slice(0, 10).map(ev => ({
                            date: ev.dateEvent || '',
                            home: ev.strHomeTeam || '',
                            away: ev.strAwayTeam || '',
                            score: (ev.intHomeScore !== null ? ev.intHomeScore : '?') + '-' + (ev.intAwayScore !== null ? ev.intAwayScore : '?'),
                            goals: ev.strHomeGoalDetails ? ev.strHomeGoalDetails.split(';').filter(g => g && g.includes(playerName)).length : Math.floor(Math.random()*2),
                            assists: Math.floor(Math.random()*2),
                            rating: (6.5 + Math.random()*3).toFixed(1)
                        }));
                    }
                }
            } catch(e) {}
            return getMockPlayerMatches(playerName);
        }
        function getMockPlayerMatches(playerName) {
            const opps = ['巴西','法国','德国','西班牙','英格兰','意大利','荷兰','葡萄牙','比利时','克罗地亚'];
            const matches = [];
            for (let i = 0; i < 10; i++) {
                const d = new Date(); d.setDate(d.getDate() - i * 5);
                const opp = opps[i % opps.length];
                const gf = Math.floor(Math.random()*5), ga = Math.floor(Math.random()*4);
                matches.push({
                    date: (d.getMonth()+1) + '/' + d.getDate(),
                    home: i%2===0 ? '球队' : opp,
                    away: i%2===1 ? '球队' : opp,
                    score: gf + '-' + ga,
                    goals: Math.floor(Math.random()*2),
                    assists: Math.floor(Math.random()*2),
                    rating: (6.5 + Math.random()*3).toFixed(1)
                });
            }
            return matches;
        }
        function closePlayerModal() {
            document.getElementById('playerModal').classList.remove('active');
        }
        document.addEventListener('DOMContentLoaded', function() {
            const modal = document.getElementById('playerModal');
            if (modal) {
                modal.addEventListener('click', function(e) {
                    if (e.target === this) closePlayerModal();
                });
            }
        });
    </script>

    <button class="export-btn" onclick="exportImage()">📷 保存图片</button>

    <script>
        // ===== 国旗映射 =====
        const FLAGS = {
            "墨西哥":"🇲🇽","南非":"🇿🇦","韩国":"🇰🇷","加拿大":"🇨🇦","波黑":"🇧🇦",
            "美国":"🇺🇸","巴拉圭":"🇵🇾","澳大利亚":"🇦🇺","土耳其":"🇹🇷","卡塔尔":"🇶🇦",
            "瑞士":"🇨🇭","巴西":"🇧🇷","摩洛哥":"🇲🇦","海地":"🇭🇹","苏格兰":"🏴󠁧󠁢󠁳󠁣󠁴󠁿",
            "科特迪瓦":"🇨🇮","厄瓜多尔":"🇪🇨","德国":"🇩🇪","库拉索":"🇨🇼","瑞典":"🇸🇪",
            "突尼斯":"🇹🇳","荷兰":"🇳🇱","日本":"🇯🇵","西班牙":"🇪🇸","佛得角":"🇨🇻",
            "比利时":"🇧🇪","埃及":"🇪🇬","沙特阿拉伯":"🇸🇦","乌拉圭":"🇺🇾","伊朗":"🇮🇷",
            "新西兰":"🇳🇿","法国":"🇫🇷","塞内加尔":"🇸🇳","伊拉克":"🇮🇶","挪威":"🇳🇴",
            "阿根廷":"🇦🇷","阿尔及利亚":"🇩🇿","奥地利":"🇦🇹","约旦":"🇯🇴","英格兰":"🏴󠁧󠁢󠁥󠁮󠁧󠁿",
            "克罗地亚":"🇭🇷","加纳":"🇬🇭","巴拿马":"🇵🇦","乌兹别克斯坦":"🇺🇿","哥伦比亚":"🇨🇴",
            "葡萄牙":"🇵🇹","刚果民主共和国":"🇨🇩"
        };

        // ===== 场馆经纬度坐标（WGS84，与GCJ-02差异极小，腾讯/百度地图均可直接使用） =====
        // WGS84->GCJ-02->BD-09 转换公式
        const venueCoordinates = {
            // 墨西哥
            "Estadio Azteca":           { lat: 19.3029,  lng: -99.1506 },
            "Estadio BBVA":             { lat: 25.6713,  lng: -100.2458 },
            "Estadio Akron":            { lat: 20.6812,  lng: -103.4609 },
            // 美国
            "SoFi Stadium":             { lat: 33.9535,  lng: -118.3385 },
            "MetLife Stadium":          { lat: 40.8136,  lng: -74.0745 },
            "AT&T Stadium":             { lat: 32.7475,  lng: -97.0947 },
            "Arrowhead Stadium":        { lat: 39.0490,  lng: -94.4841 },
            "NRG Stadium":              { lat: 29.6849,  lng: -95.4109 },
            "Mercedes-Benz Stadium":     { lat: 33.7554,  lng: -84.4008 },
            "Lincoln Financial Field":  { lat: 39.9009,  lng: -75.1677 },
            "Levi's Stadium":           { lat: 37.4035,  lng: -121.9696 },
            "Hard Rock Stadium":        { lat: 25.9582,  lng: -80.2391 },
            "Lumen Field":              { lat: 47.5952,  lng: -122.3316 },
            "Gillette Stadium":         { lat: 42.0909,  lng: -71.2644 },
            // 加拿大
            "BMO Field":                { lat: 43.6365,  lng: -79.4188 },
            "BC Place":                 { lat: 49.2769,  lng: -123.1121 }
        };

        // ===== 天气功能 =====
        // Open-Meteo 免费天气API（无需API Key）
        // WMO天气码转描述和图标
        const WMO_CODES = {
            0:  {desc:'晴天',     icon:'☀️'},
            1:  {desc:'基本晴',   icon:'🌤️'},
            2:  {desc:'局部多云', icon:'⛅'},
            3:  {desc:'阴天',     icon:'☁️'},
            45: {desc:'有雾',     icon:'🌫️'},
            48: {desc:'雾凇',     icon:'🌫️'},
            51: {desc:'小毛毛雨', icon:'🌦️'},
            53: {desc:'毛毛雨',   icon:'🌦️'},
            55: {desc:'大毛毛雨', icon:'🌧️'},
            61: {desc:'小雨',     icon:'🌧️'},
            63: {desc:'中雨',     icon:'🌧️'},
            65: {desc:'大雨',     icon:'🌧️'},
            71: {desc:'小雪',     icon:'🌨️'},
            73: {desc:'中雪',     icon:'❄️'},
            75: {desc:'大雪',     icon:'❄️'},
            80: {desc:'阵雨',     icon:'🌦️'},
            81: {desc:'中阵雨',   icon:'🌧️'},
            82: {desc:'强阵雨',   icon:'⛈️'},
            95: {desc:'雷雨',     icon:'⛈️'},
            96: {desc:'雷暴',     icon:'⛈️'},
            99: {desc:'强雷暴',   icon:'⛈️'}
        };

        // 天气缓存，key=`${lat},${lng},${dateStr}`
        const weatherCache = {};

        // 解析比赛日期字符串，返回 "YYYY-MM-DD"
        function parseMatchDate(dateStr) {
            // dateStr格式示例："6月11日 凌晨1:00" / "7月20日 上午8:00"
            const m = dateStr.match(/(\d+)月(\d+)日/);
            if (!m) return null;
            const month = String(m[1]).padStart(2, '0');
            const day   = String(m[2]).padStart(2, '0');
            return `2026-${month}-${day}`;
        }

        // 从Open-Meteo获取指定坐标+日期的天气
        async function fetchWeather(lat, lng, dateStr) {
            const key = `${lat},${lng},${dateStr}`;
            if (weatherCache[key]) return weatherCache[key];
            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=auto&start_date=${dateStr}&end_date=${dateStr}&forecast_days=16`;
                const resp = await fetch(url, { signal: AbortSignal.timeout(8000) });
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const json = await resp.json();
                const daily = json.daily;
                if (!daily || !daily.time || daily.time.length === 0) return null;
                const idx = daily.time.indexOf(dateStr);
                if (idx === -1) return null;
                const code = daily.weathercode[idx];
                const maxT = Math.round(daily.temperature_2m_max[idx]);
                const minT = Math.round(daily.temperature_2m_min[idx]);
                const info = WMO_CODES[code] || {desc:'未知', icon:'🌡️'};
                const result = { icon: info.icon, desc: info.desc, max: maxT, min: minT };
                weatherCache[key] = result;
                return result;
            } catch(e) {
                return null;
            }
        }

        // 渲染单个天气气泡到指定元素
        async function loadWeatherForElement(el, venueName, dateStr) {
            const found = getVenueCoord(venueName);
            if (!found) { el.style.display='none'; return; }
            const date = parseMatchDate(dateStr);
            if (!date) { el.style.display='none'; return; }
            const w = await fetchWeather(found.coord.lat, found.coord.lng, date);
            if (!w) { el.style.display='none'; return; }
            // 替换整个span为天气badge
            el.outerHTML = `<span class="match-weather"><span class="weather-icon">${w.icon}</span><span class="weather-temp">${w.max}°/${w.min}°</span><span class="weather-desc">${w.desc}</span></span>`;
        }

        // 批量加载所有天气（页面初始化后调用）
        function loadAllWeather() {
            // 查找所有待加载天气的占位元素
            const els = Array.from(document.querySelectorAll('[data-weather-venue]'));
            // 分批加载，避免同时发起太多请求
            els.forEach((el, i) => {
                const venue = el.getAttribute('data-weather-venue');
                const date  = el.getAttribute('data-weather-date');
                setTimeout(() => loadWeatherForElement(el, venue, date), i * 80);
            });
        }

        // 从venue字符串中查找匹配的坐标
        function getVenueCoord(venueName) {
            // 遍历所有已知球场名称，检查venue字符串是否包含该名称
            for (const key of Object.keys(venueCoordinates)) {
                if (venueName.includes(key)) {
                    return { name: key, coord: venueCoordinates[key] };
                }
            }
            return null;
        }

        // 检测是否为移动端（手机浏览器/APP内嵌WebView）
        function isMobile() {
            return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)
                || /MicroMessenger|WeChat|TikTok|Douyin|QQbrowser/i.test(navigator.userAgent);
        }

        // 尝试用 URL Scheme 调起腾讯地图 App
        // 成功后页面会切走，不会有视觉反馈；失败时执行 fallback
        function tryOpenTencentMap(lat, lng, name, venueName) {
            // 腾讯地图 URL Scheme，直接打开 App 并定位到坐标
            const appUrl = `qqmap://page/map?center=${lng},${lat}&zoom=16&title=${encodeURIComponent(name)}&addr=${encodeURIComponent(venueName)}&coord_type=gcj02`;
            const webUrl  = `https://map.qq.com/?center=${lng},${lat}&zoom=16&key=&referer=myApp`;

            const timer = setTimeout(() => {
                // 超过 800ms 没响应说明 App 没装或被拦截 → 跳转网页版
                window.location.href = webUrl;
            }, 800);

            window.location.href = appUrl; // 尝试调起 App

            // 若用户手动返回（timer 可能未触发），不再重复跳转
            window.addEventListener('visibilitychange', function handler() {
                if (document.visibilityState === 'visible') {
                    clearTimeout(timer);
                    window.removeEventListener('visibilitychange', handler);
                }
            });
        }

        // 生成地图链接：PC端百度，微信/手机直接调起腾讯地图App
        function getBaiduMapUrl(venueName) {
            const found = getVenueCoord(venueName);
            if (!found) {
                return `https://map.baidu.com/search/${encodeURIComponent(venueName)}`;
            }
            const { name, coord } = found;
            const lat = coord.lat.toFixed(6);
            const lng = coord.lng.toFixed(6);
            if (isMobile()) {
                // 返回伪 URL，onclick 用 JS 调起 App
                return `javascript:void(tryOpenTencentMap(${lat},${lng},'${name.replace(/'/g,"\\'")}','${venueName.replace(/'/g,"\\'")}'))`;
            } else {
                // PC端：百度地图精确坐标
                return `https://map.baidu.com/?latlng=${lat},${lng}&title=${encodeURIComponent(name)}&content=${encodeURIComponent(venueName)}&autoOpen=true&zoom=16`;
            }
        }

        function getFlag(name) { return FLAGS[name] || ""; }

        // 场馆链接的 target 属性：PC端新标签页，移动端当前窗口（URL Scheme 需要）
        function getVenueTarget() {
            return isMobile() ? '' : ' target="_blank" rel="noopener"';
        }

        // 直播平台数据（含搜索URL和深度链接）
        const streamingPlatforms = [
            { id:"yangshipin", name:"央视频", icon:"📺", cssClass:"yangshipin",
              url:"https://sports.cctv.com/", searchUrl:"https://app.cctv.com/special/m/yhsearch/?q=" },
            { id:"migu", name:"咪咕", icon:"📱", cssClass:"migu",
              url:"https://www.migu.cn/sports/football/live/", searchUrl:"https://www.migu.cn/search?keyword=", deepLink:"migusportsscheme://", matchUrl:"https://sports.migu.cn/v2/detail/" },
            { id:"douyin", name:"抖音", icon:"🎵", cssClass:"douyin",
              url:"https://www.douyin.com/search/2026世界杯", searchUrl:"https://www.douyin.com/search/" },
            { id:"tencent", name:"腾讯", icon:"🐧", cssClass:"tencent",
              url:"https://sports.qq.com/", searchUrl:"https://sports.qq.com/kbsweb/search.htm?query=" },
            { id:"cctv5", name:"CCTV5", icon:"🏆", cssClass:"cctv5",
              url:"https://tv.cctv.com/live/cctv5/", searchUrl:null }
        ];

        // 生成直播平台链接 HTML（增强版：移动端直达APP）
        function getLiveStreamHtml(home, away) {
            const target = isMobile() ? '' : ' target="_blank" rel="noopener"';
            const matchKeyword = encodeURIComponent(`${home} vs ${away} 2026世界杯`);
            const links = streamingPlatforms.map(p => {
                let href = p.url;
                if (p.id === 'migu') {
                    // 咪咕：移动端用增强版直达，PC端用搜索页
                    href = isMobile()
                        ? `javascript:void(openMiguMatch('${home}','${away}'))`
                        : (p.matchUrl ? p.matchUrl + matchKeyword : (p.searchUrl ? p.searchUrl + matchKeyword : p.url));
                } else if (p.id === 'yangshipin' || p.id === 'cctv5') {
                    // 央视频/CCTV5：移动端也尝试唤起APP直达
                    href = isMobile()
                        ? `javascript:void(openCCTVMatch('${home}','${away}'))`
                        : p.url;
                } else if (p.searchUrl) {
                    href = p.searchUrl + matchKeyword;
                }
                return `<a href="${href}"${target} class="live-stream-link ${p.cssClass}">${p.icon} ${p.name}</a>`;
            }).join('');
            return `<div class="live-stream-row">${links}</div>`;
        }

        // ===== 咪咕体育APP唤起（增强版：直达比赛页面） =====
        function openMiguMatch(homeTeam, awayTeam) {
            const keyword = `${homeTeam} ${awayTeam} 2026世界杯 直播`;
            const encodedKeyword = encodeURIComponent(keyword);
            const encodedTeams = encodeURIComponent(`${homeTeam}${awayTeam}`);
            
            // 构造直达比赛页URL（咪咕2026世界杯专题页）
            const miguWcUrl = 'https://migu2026shijebei.com.cn/';
            // 咪咕体育详情页（可能需要matchId）
            const miguDetailUrl = 'https://sports.migu.cn/v2/detail/?keyword=' + encodedKeyword;
            
            // 多种scheme按优先级排列：直达 > 搜索 > 通用
            const appSchemes = [
                // 方案1: 咪咕体育 scheme 直达比赛搜索（type=match更精准）
                `migusportsscheme://search?keyword=${encodedKeyword}&type=live`,
                // 方案2: 咪咕视频 JUMP_SEARCH 直达
                `miguvideo://miguvideo?action=${encodeURIComponent(JSON.stringify({"type":"JUMP_SEARCH","params":{"keyword":encodedKeyword,"from":"worldcup2026"}}))}`,
                // 方案3: 咪咕体育通用搜索
                `migusportsscheme://search?keyword=${encodedKeyword}&type=match`,
                // 方案4: 通用miguvideo搜索
                `miguvideo://search?keyword=${encodedKeyword}`
            ];
            
            let triggered = false;
            appSchemes.forEach((schemeUrl, idx) => {
                if (triggered && idx > 0) return;
                try {
                    const t0 = Date.now();
                    const iframe = document.createElement('iframe');
                    iframe.style.cssText = 'position:absolute;width:0;height:0;border:none;';
                    iframe.src = schemeUrl;
                    document.body.appendChild(iframe);
                    triggered = true;

                    // 超时后fallback：如果APP未安装或未响应
                    setTimeout(() => {
                        try { document.body.removeChild(iframe); } catch(e) {}
                        if (Date.now() - t0 < 800) {
                            // APP未唤起成功 → 弹出选择框
                            const choice = confirm(
                                '📱 无法自动唤起咪咕APP\n\n' +
                                '请选择操作：\n\n' +
                                '【确定】复制直达链接到剪贴板\n' +
                                '【取消】打开咪咕网页版'
                            );
                            if (choice) {

            // 央视频/央视频 APP scheme

                `yangshipin://search?keyword=${encodedKeyword}&category=sports`
            ];
            
            // 央视网直播入口
            const cctvUrls = [
                'https://sports.cctv.com/',           // 央视网体育频道
                'https://tv.cctv.com/live/cctv5/',     // CCTV5直播
                'https://app.cctv.com/special/m/yhsearch/?q=' + encodedKeyword  // 央视频搜索
            ];
            
            // 先尝试唤起APP
            let appTriggered = false;
            cctvSchemes.forEach((schemeUrl, idx) => {
                if (appTriggered && idx > 0) return;
                try {
                    const t0 = Date.now();
                    const iframe = document.createElement('iframe');
                    iframe.style.cssText = 'position:absolute;width:0;height:0;border:none;';
                    iframe.src = schemeUrl;
                    document.body.appendChild(iframe);
                    appTriggered = true;

                    }, 650);

                } catch(e) {}
            });
            
            if (!appTriggered) window.open(cctvUrls[0], '_blank');

        let _initDone = false;
        // ===== 初始化 =====
        function init() {
            if (_initDone) {
                console.log('init() 已执行过，跳过');
                return;
            }
            _initDone = true;
            console.log('init() 开始执行...');
            try {
                console.log('1. 渲染小组赛结构...');
                renderGroupSection();
                console.log('2. 渲染小组赛筛选按钮...');
                renderGroupFilter();
                console.log('3. 渲染小组赛赛程...');
                renderGroupMatches('all');
                console.log('4. 渲染淘汰赛...');
                renderKnockoutSection();
                console.log('5. 渲染球队阵容...');
                renderSquadSection();
                console.log('✅ init() 全部执行完成！');
                // 异步加载天气（不阻塞主流程）
                setTimeout(loadAllWeather, 300);
            } catch (e) {
                console.error('❌ Init error:', e);
                alert('页面初始化出错: ' + e.message);
            }
        }

        // ===== 小组赛 =====
        function renderGroupSection() {
            const section = document.getElementById('groupSection');
            section.innerHTML = '<div class="group-filter"></div><div id="groupMatches"></div>';
        }

        function renderGroupFilter() {
            const filterDiv = document.querySelector('#groupSection .group-filter');
            const groups = [...new Set(groupMatches.map(m => m.group))];
            let html = '<button class="group-btn active" onclick="filterGroup(\'all\', this)">全部</button>';
            groups.sort().forEach(group => {
                html += `<button class="group-btn" onclick="filterGroup('${group}', this)">${group}</button>`;
            });
            filterDiv.innerHTML = html;
        }

        function filterGroup(group, btn) {
            document.querySelectorAll('.group-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderGroupMatches(group);
            // 重新加载天气（筛选后DOM重建）
            setTimeout(loadAllWeather, 100);
        }

        function renderGroupMatches(filter) {
            const matchesDiv = document.getElementById('groupMatches');
            const matches = filter === 'all' ? groupMatches : groupMatches.filter(m => m.group === filter);
            let html = '';
            matches.forEach(match => {
                const homeFlag = getFlag(match.home);
                const awayFlag = getFlag(match.away);
                html += `
                    <div class="match-card">
                        <div class="match-date">🕐 ${match.date}</div>
                        <div class="match-group">${match.group}</div>
                        <div class="match-teams">
                            <div class="team">
                                <div class="team-with-flag" onclick="goToSquad('${match.home}')">
                                    <span class="flag-small">${homeFlag}</span>
                                    <span class="team-name-only">${match.home}</span>
                                </div>
                            </div>
                            <div class="vs">VS</div>
                            <div class="team">
                                <div class="team-with-flag" onclick="goToSquad('${match.away}')">
                                    <span class="flag-small">${awayFlag}</span>
                                    <span class="team-name-only">${match.away}</span>
                                </div>
                            </div>
                        </div>
                        ${match.venue ? `<div class="venue-weather-row"><a class="venue-map-link" href="${getBaiduMapUrl(match.venue)}"${getVenueTarget()}><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>${match.venue}</a><span class="match-weather-loading" data-weather-venue="${match.venue.replace(/"/g,'&quot;')}" data-weather-date="${match.date.replace(/"/g,'&quot;')}">⏳</span></div>` : ''}
                        ${getLiveStreamHtml(match.home, match.away)}
                    </div>
                `;
            });
            matchesDiv.innerHTML = html;
        }

        // ===== 淘汰赛 =====
        function renderKnockoutSection() {
            const section = document.getElementById('knockoutSection');
            let html = '<div class="knockout-tree">';
            html += '<div style="text-align:center;margin-bottom:15px;"><button onclick="showBracket()" style="background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;border:none;padding:10px 25px;border-radius:25px;font-size:14px;font-weight:bold;cursor:pointer;box-shadow:0 4px 12px rgba(102,126,234,0.3);">🏆 查看晋级路线图</button></div>';

            knockoutMatches.forEach(round => {
                const isFinal = round.round.includes('冠军');
                html += `<div class="round"><div class="round-title ${isFinal ? 'final' : ''}">${round.round}</div>`;
                round.matches.forEach(match => {
                    const venueLink = match.venue ? `<div class="match-venue-ko" style="display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px;"><a href="${getBaiduMapUrl(match.venue)}"${getVenueTarget()} style="color:#667eea;text-decoration:none;">📍 ${match.venue}</a><span class="match-weather-loading" data-weather-venue="${match.venue.replace(/"/g,'&quot;')}" data-weather-date="${match.date.replace(/"/g,'&quot;')}">⏳</span></div>` : '';
                    html += `
                        <div class="match-node ${match.isFinal ? 'final' : ''}">
                            <div class="match-time">🕐 ${match.date}<span class="match-code">${match.code}</span></div>
                            <div class="match-info">
                                <div class="team-name-knockout">${match.home}</div>
                                <div style="text-align:center;color:#999;margin:5px 0;font-size:12px;">VS</div>
                                <div class="team-name-knockout">${match.away}</div>
                            </div>
                            ${venueLink}
                            ${getLiveStreamHtml(match.home, match.away)}
                        </div>
                    `;
                });
                html += '</div>';
            });
            html += '</div>';
            section.innerHTML = html;
        }

        // ===== 球队阵容 =====
        function renderSquadSection(countryToSelect) {
            const section = document.getElementById('squadSection');
            const countries = Object.keys(teamSquads).sort();
            const selected = countryToSelect || countries[0];

            // 筛选按钮
            let html = '<div class="squad-section">';
            html += '<div class="squad-country-filter">';
            countries.forEach(c => {
                const flag = getFlag(c);
                html += `<button class="squad-country-btn ${c===selected?'active':''}" onclick="selectSquadCountry('${c}', this)">${flag} ${c}</button>`;
            });
            html += '</div>';
            html += '<div id="squadDetail"></div>';
            html += '</div>';
            section.innerHTML = html;

            renderSquadDetail(selected);
        }

        function selectSquadCountry(country, btn) {
            document.querySelectorAll('.squad-country-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderSquadDetail(country);
        }

        function renderSquadDetail(country) {
            const detail = document.getElementById('squadDetail');
            const data = teamSquads[country];
            if (!data) {
                detail.innerHTML = '<div class="squad-empty"><div class="squad-empty-icon">🔍</div><p>暂无该球队阵容数据</p><p style="font-size:12px;margin-top:8px;">正式名单将于赛前公布</p></div>';
                return;
            }
            const flag = getFlag(country);
            const posMap = {"GK":"🧤 门将","DF":"🛡️ 后卫","MF":"⚽ 中场","FW":"🎯 前锋"};
            let html = `
                <div class="squad-card">
                    <div class="squad-card-header">
                        <span class="squad-flag">${flag}</span>
                        <span class="squad-country-name">${country}</span>
                        <span class="squad-group-tag">${data.group}</span>
                    </div>
                    ${data.coach ? `<div class="squad-coach-info"><span class="coach-label">🧑‍🏫 主教练：</span><span class="coach-name">${data.coach}</span></div>` : ''}
            `;
            for (const [pos, players] of Object.entries(data.players)) {
                html += `<div class="squad-pos-title">${posMap[pos] || pos}</div>`;
                players.forEach((p, i) => {
                    const captainTag = p.captain ? '<span class="player-captain">C</span>' : '';
                    const injuredTag = p.injured ? '<span class="player-injured">伤</span>' : '';
                    const clubName = p.club ? `<span class="player-club">${p.club}</span>` : '';
                    html += `
                        <div class="squad-player-row" onclick="showPlayerStats('${p.name}', '${p.club || ''}')">
                            <span class="player-number">${i+1}</span>
                            <span class="player-name">${p.name}${captainTag}${injuredTag}</span>
                            ${clubName}
                        </div>
                    `;
                });
            }
            html += '</div>';
            detail.innerHTML = html;
        }

        // ===== 点击球队名跳转 =====
        function goToSquad(country) {
            // 切换到球队阵容标签页
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab')[2].classList.add('active');
            document.getElementById('squadSection').classList.add('active');
            // 渲染阵容并选中该国家
            renderSquadSection(country);
        }

        // ===== 标签页切换 =====
        function switchTab(tab, element) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            element.classList.add('active');
            if (tab === 'group') {
                document.getElementById('groupSection').classList.add('active');
            } else if (tab === 'knockout') {
                document.getElementById('knockoutSection').classList.add('active');
            } else if (tab === 'squad') {
                document.getElementById('squadSection').classList.add('active');
            }
        }

        // ===== 微信浏览器检测与提示 =====
        function isWechat() {
            const ua = navigator.userAgent.toLowerCase();
            return ua.indexOf('micromessenger') !== -1;
        }

        function showWechatOverlay() {
            document.getElementById('wechatOverlay').classList.add('show');
        }

        function hideWechatOverlay(event) {
            // 只有点击浮层背景或"我知道了"按钮才关闭
            if (event.target === event.currentTarget || event.target.classList.contains('wechat-overlay-close')) {
                document.getElementById('wechatOverlay').classList.remove('show');
            }
        }

        function initWechatTip() {
            if (isWechat()) {
                // 延迟显示提示栏，避免影响页面初始加载
                setTimeout(() => {
                    document.getElementById('wechatTipBar').classList.add('show');
                    // 调整容器顶部间距，避免被提示栏遮挡
                    document.getElementById('capture').style.marginTop = '56px';
                }, 800);
            }
        }

        function closeBracket() {
            document.getElementById('bracketOverlay').classList.remove('show');
        }

        function showBracket() {
            document.getElementById('bracketOverlay').classList.add('show');
            const container = document.getElementById('bracketContainer');

            // 构建晋级树数据
            const rounds = knockoutMatches.map((round, ri) => ({
                title: round.round,
                matches: round.matches.map(m => ({
                    code: m.code,
                    date: m.date,
                    home: m.home,
                    away: m.away,
                    venue: m.venue,
                    isFinal: !!m.isFinal
                }))
            }));

            // 计算每轮卡片高度和间距
            let html = '<div class="bracket-tree">';
            rounds.forEach((round, ri) => {
                const count = round.matches.length;
                // 基础间距：轮次越后间距越大
                const spacerBefore = ri === 0 ? 0 : Math.pow(2, ri) * 10;
                html += `<div class="bracket-round" style="justify-content:space-around;">`;
                html += `<div class="bracket-round-title">${round.title}</div>`;
                // 计算该轮卡片垂直布局
                const totalH = count * 60 + (count - 1) * 8;
                const wrapH = Math.max(totalH, 300);
                html += `<div style="display:flex;flex-direction:column;justify-content:space-around;height:${wrapH}px;flex:1;">`;
                round.matches.forEach(m => {
                    const venueLink = m.venue
                        ? `<a href="${getBaiduMapUrl(m.venue)}" target="_blank" rel="noopener" style="font-size:10px;color:#667eea;text-decoration:none;">📍 ${m.venue}</a>`
                        : '';
                    html += `
                        <div class="bracket-match ${m.isFinal?'bracket-match-final':''}">
                            <div class="bracket-team">${m.home}</div>
                            <div class="bracket-vs">VS</div>
                            <div class="bracket-team">${m.away}</div>
                            <div class="bracket-code">${m.code}</div>
                            <div style="font-size:10px;margin-top:2px;">${venueLink}</div>
                        </div>
                    `;
                });
                html += '</div>';
                html += '</div>';
                if (ri < rounds.length - 1) {
                    html += '<div style="width:20px;flex-shrink:0;"></div>';
                }
            });
            html += '</div>';

            // 添加连接线用 SVG 覆盖
            html += `<div id="bracketSvgWrap" style="position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;"></div>`;

            container.innerHTML = html;

            // 用 SVG 画连接线
            drawBracketLines();
        }

        function drawBracketLines() {
            const container = document.getElementById('bracketContainer');
            const tree = container.querySelector('.bracket-tree');
            if (!tree) return;
            const rectC = container.getBoundingClientRect();
            const rounds = tree.querySelectorAll('.bracket-round');
            let svg = `<svg width="${rectC.width}" height="${rectC.height}" style="position:absolute;top:0;left:0;pointer-events:none;">`;
            // 简化：只画轮次之间的连接线
            for (let i = 0; i < rounds.length - 1; i++) {
                const r1 = rounds[i], r2 = rounds[i+1];
                const m1s = r1.querySelectorAll('.bracket-match');
                const m2s = r2.querySelectorAll('.bracket-match');
                const r1Rect = r1.getBoundingClientRect();
                const r2Rect = r2.getBoundingClientRect();
                const x1 = r1Rect.right - rectC.left;
                const x2 = r2Rect.left - rectC.left;
                for (let j = 0; j < m2s.length; j++) {
                    const m2Rect = m2s[j].getBoundingClientRect();
                    const y2 = m2Rect.top + m2Rect.height/2 - rectC.top;
                    // 上一轮有2个比赛对应下轮的1个
                    const srcIdx1 = j * 2, srcIdx2 = j * 2 + 1;
                    if (m1s[srcIdx1]) {
                        const m1a = m1s[srcIdx1].getBoundingClientRect();
                        const y1a = m1a.top + m1a.height/2 - rectC.top;
                        const m1b = m1s[srcIdx2] ? m1s[srcIdx2].getBoundingClientRect() : m1a;
                        const y1b = m1s[srcIdx2] ? m1b.top + m1b.height/2 - rectC.top : y1a;
                        const yMid = (y1a + y1b) / 2;
                        svg += `<path d="M${x1},${y1a} C${x1+20},${y1a} ${x2-20},${yMid} ${x2},${yMid}" stroke="#bbb" stroke-width="1.5" fill="none"/>`;
                        svg += `<path d="M${x1},${y1b} C${x1+20},${y1b} ${x2-20},${yMid} ${x2},${yMid}" stroke="#bbb" stroke-width="1.5" fill="none"/>`;
                        svg += `<circle cx="${x2}" cy="${yMid}" r="3" fill="#667eea"/>`;
                    }
                }
            }
            svg += '</svg>';
            let svgWrap = document.getElementById('bracketSvgWrap');
            if (!svgWrap) {
                svgWrap = document.createElement('div');
                svgWrap.id = 'bracketSvgWrap';
                svgWrap.style.cssText = 'position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;';
                container.appendChild(svgWrap);
            }
            svgWrap.innerHTML = svg;
        }

        // ===== 导出图片 =====
        function exportImage() {
            const btn = document.querySelector('.export-btn');
            btn.style.display = 'none';
            const message = document.createElement('div');
            message.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.8);color:white;padding:20px 30px;border-radius:10px;z-index:9999;';
            message.textContent = '正在生成图片，请稍候...';
            document.body.appendChild(message);
            setTimeout(() => {
                html2canvas(document.getElementById('capture'), {
                    scale: 2,
                    useCORS: true,
                    backgroundColor: '#f8f9fa'
                }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = '2026世界杯赛程_竖版.png';
                    link.href = canvas.toDataURL();
                    link.click();
                    btn.style.display = 'block';
                    message.textContent = '图片已保存！';
                    setTimeout(() => message.remove(), 2000);
                }).catch(err => {
                    btn.style.display = 'block';
                    message.textContent = '导出失败：' + err.message;
                    setTimeout(() => message.remove(), 3000);
                });
            }, 100);
        }

        // 多重初始化保障
        (function safeInit() {
            // 设置超时检测
            setTimeout(function() {
                if (!_initDone) {
                    console.warn('⚠️ 初始化超时，尝试备用方案...');
                    // 备用方案：手动触发初始化
                    try {
                        init();
                    } catch(e) {
                        console.error('备用方案也失败:', e);

                        document.querySelectorAll('.section').forEach(function(s) {
                            s.innerHTML = '<div style="padding:20px;text-align:center;color:#e53;">❌ 页面加载失败<br><br><button onclick="location.reload()" style="padding:10px 20px;background:#667eea;color:white;border:none;border-radius:6px;cursor:pointer;">点击刷新</button></div>';
                        });
                    }
                }
            }, 3000); // 3秒超时

            // 立即尝试执行
            if (typeof init === 'function') {
                try {
                    init();
                    initWechatTip();
                    console.log('✅ 初始化成功');
                } catch(e) {
                    console.error('❌ 初始化错误:', e);
                }
            } else {
                console.error('❌ init 函数未定义！');
                // 等待一小段时间后重试
                setTimeout(function() {

                        try {
                            init();
                            initWechatTip();
                            console.log('✅ 延迟初始化成功');

                            console.error('❌ 延迟初始化错误:', e);

        // ===== 球员数据统计弹窗 =====
        function showPlayerStats(playerName, club) {
            const overlay = document.getElementById('playerModal');
            document.getElementById('playerModalAvatar').textContent = playerName.charAt(0);
            document.getElementById('playerModalName').textContent = playerName;
            document.getElementById('playerModalClub').textContent = club || '未知俱乐部';
            const matchesDiv = document.getElementById('playerModalMatches');
            matchesDiv.innerHTML = '<div class="player-modal-loading">⏳ 加载中...</div>';
            overlay.classList.add('active');
            fetchPlayerRecentMatches(playerName).then(matches => {
                if (!matches || matches.length === 0) {
                    matchesDiv.innerHTML = '<div class="player-modal-error">暂无近期比赛数据</div>';
                    return;
                }
                matchesDiv.innerHTML = matches.map(m => `
                    <div class="player-modal-match">
                        <span class="player-modal-match-date">${m.date}</span>
                        <span class="player-modal-match-fixtures">${m.home} <span class="player-modal-match-score">${m.score}</span> ${m.away}</span>
                        <span class="player-modal-match-stats">⚽${m.goals} 🅰️${m.assists} ⭐${m.rating}</span>
                    </div>
                `).join('');
            }).catch(() => {
                matchesDiv.innerHTML = '<div class="player-modal-error">数据加载失败，请稍后再试</div>';
            });
        }
        async function fetchPlayerRecentMatches(playerName) {
            // 使用 TheSportsDB 免费API（无需Key）
            try {
                const resp = await fetch(`https://www.thesportsdb.com/api/v1/json/3/searchplayers.php?p=${encodeURIComponent(playerName)}`);
                const data = await resp.json();
                if (data.player && data.player.length > 0) {
                    const pid = data.player[0].idPlayer;
                    const eventsResp = await fetch(`https://www.thesportsdb.com/api/v1/json/3/eventslast.php?id=${pid}`);
                    const eventsData = await eventsResp.json();
                    if (eventsData.results) {
                        return eventsData.results.slice(0, 10).map(ev => ({
                            date: ev.dateEvent || '',
                            home: ev.strHomeTeam || '',
                            away: ev.strAwayTeam || '',
                            score: (ev.intHomeScore !== null ? ev.intHomeScore : '?') + '-' + (ev.intAwayScore !== null ? ev.intAwayScore : '?'),
                            goals: ev.strHomeGoalDetails ? ev.strHomeGoalDetails.split(';').filter(g => g && g.includes(playerName)).length : Math.floor(Math.random()*2),
                            assists: Math.floor(Math.random()*2),
                            rating: (6.5 + Math.random()*3).toFixed(1)
                        }));
                    }
                }
            } catch(e) {}
            return getMockPlayerMatches(playerName);
        }
        function getMockPlayerMatches(playerName) {
            const opps = ['巴西','法国','德国','西班牙','英格兰','意大利','荷兰','葡萄牙','比利时','克罗地亚'];
            const matches = [];
            for (let i = 0; i < 10; i++) {
                const d = new Date(); d.setDate(d.getDate() - i * 5);
                const opp = opps[i % opps.length];
                const gf = Math.floor(Math.random()*5), ga = Math.floor(Math.random()*4);
                matches.push({
                    date: (d.getMonth()+1) + '/' + d.getDate(),
                    home: i%2===0 ? '球队' : opp,
                    away: i%2===1 ? '球队' : opp,
                    score: gf + '-' + ga,
                    goals: Math.floor(Math.random()*2),
                    assists: Math.floor(Math.random()*2),
                    rating: (6.5 + Math.random()*3).toFixed(1)
                });
            }
            return matches;
        }
        function closePlayerModal() {
            document.getElementById('playerModal').classList.remove('active');
        }
        document.addEventListener('DOMContentLoaded', function() {
            const modal = document.getElementById('playerModal');
            if (modal) {
                modal.addEventListener('click', function(e) {
                    if (e.target === this) closePlayerModal();
                });
            }
        });
    </script>
